
[project]
name = "findex"
version = "0.4.0"
description = "Search engine based on an inverted index"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pyright",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/findex"]
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than one second",
]
